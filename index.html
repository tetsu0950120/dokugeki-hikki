<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <style>
        body { font-family: -apple-system, sans-serif; background: #000000; padding: 20px; color: #f0f0f0; margin-top: 60px; }
        
        /* 常に表示されるステータスバー */
        .status-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: #121212;
            border-bottom: 1px solid #2c2c2e;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 1000;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(0,0,0,0.8);
        }
        .status-item { text-align: center; font-size: 0.9em; color: #a1a1a6; }
        .status-value { color: #0a84ff; font-size: 1.1em; display: block; }

        .card { background: #1c1c1e; padding: 20px; border-radius: 15px; box-shadow: 0 4px 16px rgba(0,0,0,0.9); max-width: 500px; margin: auto; border: 1px solid #2c2c2e; }
        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        #q-number { color: #8e8e93; font-size: 0.8em; }
        
        .copy-btn { background: #0a84ff; color: white; border: none; padding: 6px 12px; border-radius: 8px; font-size: 0.8em; cursor: pointer; font-weight: bold; }
        .question { font-weight: bold; margin-bottom: 20px; font-size: 1.1em; line-height: 1.6; white-space: pre-wrap; color: #ffffff; }
        .option { display: block; width: 100%; padding: 15px; margin-bottom: 12px; border: 2px solid #2c2c2e; border-radius: 10px; text-align: left; background: #2c2c2e; color: #ffffff; font-size: 1em; cursor: pointer; }
        .option.correct-ans { background: #1b3820; border-color: #30d158; color: #30d158; font-weight: bold; }
        .option.wrong-ans { background: #3b1d1d; border-color: #ff453a; color: #ff453a; }
        
        #result-text { margin-top: 15px; font-weight: bold; text-align: center; font-size: 1.2em; min-height: 1.5em; }
        .footer-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .next-btn { display: none; padding: 16px; background: #30d158; color: white; border: none; border-radius: 10px; font-size: 1em; font-weight: bold; cursor: pointer; }
        .quit-btn { display: none; padding: 16px; background: #636366; color: white; border: none; border-radius: 10px; font-size: 1em; font-weight: bold; cursor: pointer; }
        
        .summary { text-align: center; padding: 10px; }
        .rate { font-size: 2.5em; color: #ffffff; font-weight: bold; margin: 10px 0; }
        .mode-title { color: #ff453a; font-weight: bold; margin-bottom: 10px; }
        .retry-btn { width: 100%; padding: 16px; background: #0a84ff; color: white; border: none; border-radius: 10px; font-size: 1em; font-weight: bold; margin-bottom: 10px; cursor: pointer; }
        .review-btn { width: 100%; padding: 16px; background: #ff9f0a; color: white; border: none; border-radius: 10px; font-size: 1em; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="status-bar" id="live-status-bar">
    <div class="status-item">進捗<span id="live-progress" class="status-value">0 / 0</span></div>
    <div class="status-item">正解数<span id="live-correct" class="status-value">0</span></div>
    <div class="status-item">正答率<span id="live-rate" class="status-value">0%</span></div>
</div>

<div class="card" id="main-card">
    <div id="quiz-screen">
        <div class="header-row">
            <div id="q-number">準備中...</div>
            <button class="copy-btn" onclick="copyEverything()">AI質問用にコピー</button>
        </div>
        <div class="question" id="question-text">読み込み中...</div>
        <div id="options-container"></div>
        <div id="result-text"></div>
        <div class="footer-btns">
            <button class="quit-btn" id="quit-btn" onclick="showResult(true)">中断して終了</button>
            <button class="next-btn" id="next-btn" onclick="nextQuestion()">次の問題へ</button>
        </div>
    </div>
    
    <div id="result-screen" style="display:none;">
        <div class="summary">
            <h2 id="result-title" style="color: #ffffff;">結果発表</h2>
            <div id="mode-notice" class="mode-title" style="display:none;">【復習モード】</div>
            <div class="rate"><span id="correct-rate">0</span>%</div>
            <p style="color: #a1a1a6;"><span id="answered-count">0</span>問中、<span id="correct-count">0</span>問正解</p>
            <div id="review-area" style="display:none; margin-top:20px;">
                <p style="color: #a1a1a6;">間違えた問題が <span id="wrong-count">0</span> 問あります</p>
                <button class="review-btn" onclick="startReview()">間違えた問題だけ解く</button>
            </div>
            <hr style="margin:20px 0; border:0; border-top:1px solid #2c2c2e;">
            <button class="retry-btn" onclick="initQuiz()">最初から解き直す</button>
        </div>
    </div>
</div>

    let quizSet = [];
    let wrongQuestions = [];
    let currentIdx = 0;
    let isAnswered = false;
    let correctCount = 0;
    let answeredCount = 0;
    let isReviewMode = false;

    const shuffle = (array) => {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    };

    function updateLiveStatus() {
        document.getElementById('live-progress').innerText = `${currentIdx + 1} / ${quizSet.length}`;
        document.getElementById('live-correct').innerText = correctCount;
        const rate = answeredCount > 0 ? Math.round((correctCount / answeredCount) * 100) : 0;
        document.getElementById('live-rate').innerText = `${rate}%`;
    }

    function initQuiz() {
        quizSet = shuffle([...rawData]);
        wrongQuestions = [];
        correctCount = 0;
        answeredCount = 0;
        isReviewMode = false;
        startCommon();
    }

    function startReview() {
        quizSet = shuffle([...wrongQuestions]);
        wrongQuestions = [];
        correctCount = 0;
        answeredCount = 0;
        isReviewMode = true;
        startCommon();
    }

    function startCommon() {
        currentIdx = 0;
        document.getElementById('quiz-screen').style.display = 'block';
        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('live-status-bar').style.display = 'flex';
        document.getElementById('mode-notice').style.display = isReviewMode ? 'block' : 'none';
        loadQuestion();
    }

    function loadQuestion() {
        isAnswered = false;
        const data = quizSet[currentIdx];
        document.getElementById('q-number').innerText = (isReviewMode ? "復習 " : "問題 ") + `${currentIdx + 1} / ${quizSet.length}`;
        document.getElementById('question-text').innerText = data.q;
        const container = document.getElementById('options-container');
        container.innerHTML = '';
        document.getElementById('result-text').innerText = '';
        document.getElementById('next-btn').style.display = 'none';
        document.getElementById('quit-btn').style.display = 'none';

        updateLiveStatus();

        const shuffledOptions = shuffle([...data.a]);
        shuffledOptions.forEach((text) => {
            const btn = document.createElement('button');
            btn.className = 'option';
            btn.innerText = text;
            btn.onclick = () => checkAnswer(btn, text, data.a[0]);
            container.appendChild(btn);
        });
    }

    function checkAnswer(selectedBtn, selectedText, correctText) {
        if (isAnswered) return;
        isAnswered = true;
        answeredCount++;
        const allButtons = document.querySelectorAll('.option');
        allButtons.forEach(btn => { if (btn.innerText === correctText) btn.classList.add('correct-ans'); });
        
        if (selectedText === correctText) {
            correctCount++;
            document.getElementById('result-text').innerText = "⭕ 正解！";
            document.getElementById('result-text').style.color = "#30d158";
        } else {
            selectedBtn.classList.add('wrong-ans');
            document.getElementById('result-text').innerText = "❌ 不正解";
            document.getElementById('result-text').style.color = "#ff453a";
            wrongQuestions.push(quizSet[currentIdx]);
        }
        
        updateLiveStatus();
        document.getElementById('next-btn').style.display = 'block';
        document.getElementById('quit-btn').style.display = 'block';
    }

    function nextQuestion() {
        currentIdx++;
        if (currentIdx < quizSet.length) { loadQuestion(); } 
        else { showResult(false); }
    }

    function showResult(isInterrupted) {
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('live-status-bar').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';
        
        document.getElementById('result-title').innerText = isInterrupted ? "中断スコア" : "結果発表";
        
        const rate = answeredCount > 0 ? Math.round((correctCount / answeredCount) * 100) : 0;
        
        document.getElementById('correct-rate').innerText = rate;
        document.getElementById('answered-count').innerText = answeredCount;
        document.getElementById('correct-count').innerText = correctCount;
        
        const reviewArea = document.getElementById('review-area');
        if (wrongQuestions.length > 0) {
            reviewArea.style.display = 'block';
            document.getElementById('wrong-count').innerText = wrongQuestions.length;
        } else {
            reviewArea.style.display = 'none';
        }
    }

    function copyEverything() {
        const btn = document.querySelector('.copy-btn');
        const originalText = btn.innerText;
        
        const qText = document.getElementById('question-text').innerText;
        const options = Array.from(document.querySelectorAll('.option')).map((btn, i) => `${i + 1}. ${btn.innerText}`).join('\n');
        const fullPrompt = `以下の問題を詳しく解説してください。\n\n【問題】\n${qText}\n\n【選択肢】\n${options}`;
        
        navigator.clipboard.writeText(fullPrompt).then(() => {
            btn.innerText = '完了！';
            setTimeout(() => { 
                btn.innerText = originalText; 
            }, 2000);
        }).catch(err => {
            console.error('コピーに失敗しました', err);
        });
    }

    initQuiz();
</script>
